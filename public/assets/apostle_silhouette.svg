<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Apostle Joe Daniels Silhouette Logo -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2B7"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
  </defs>

  <!-- Apostolic Preaching Figure Silhouette -->
  <!-- Left Hand Raised High in Authority (viewer's right) -->
  <g fill="url(#goldGrad)">
    <!-- Head and Profile -->
    <circle cx="50" cy="22" r="5" />
    <path d="M47 26 C47 25, 53 25, 53 26 L52 29 L48 29 Z" />

    <!-- Raised Left Arm (preaching / declaring victory) -->
    <!-- Upraised forearm and fist -->
    <path d="M54 29 C56 29, 60 26, 62 20 C63 17, 65 14, 65 10 C66 9, 68 9, 68 11 C68 13, 65 18, 64 22 C62 27, 57 32, 55 33 Z" />
    <!-- Upraised fist / hand -->
    <circle cx="67" cy="10" r="2.8" />
    <path d="M68 9 C69 9, 70 11, 69 13 C68 14, 66 14, 66 12 Z" />

    <!-- Right Arm (resting naturally along suit jacket) -->
    <path d="M46 29 C44 30, 42 35, 41 40 C40 44, 40 48, 41 51 C41.5 52, 43 52, 43 50 C43 46, 43.5 42, 45 36 C45.5 33, 46 31, 47 30 Z" />
    <!-- Right Hand -->
    <circle cx="41.5" cy="51.5" r="1.5" />

    <!-- Torso & Tailored Suit Jacket -->
    <path d="M47 29 L54 29 L56 34 L55 46 L53 52 L47 52 L45 46 L44 34 Z" />
    <!-- Suit lapel / center seam accent -->
    <path d="M50 29 L50 48" stroke="#001F3F" stroke-width="0.8" />
    <path d="M48 30 L50 38 L52 30" stroke="#001F3F" stroke-width="0.7" fill="none" />

    <!-- Trousers & Legs in Strong Apostolic Stance -->
    <!-- Left leg -->
    <path d="M50 51 L53 51 L54 75 L55 83 L51 83 L50 70 Z" />
    <!-- Left shoe -->
    <path d="M51 83 L56 83 C57 83, 57 85, 55 85 L50 85 Z" />

    <!-- Right leg -->
    <path d="M47 51 L50 51 L49 70 L48 83 L44 83 L45 75 Z" />
    <!-- Right shoe -->
    <path d="M44 83 L49 83 C49 85, 47 85, 43 85 C42 85, 42 83, 44 83 Z" />
  </g>
</svg>
